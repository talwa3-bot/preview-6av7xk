<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>שאלון פרופיל | חגי ולנשטין ושות׳</title><link rel="stylesheet" href="studio.css"><style>body{background:var(--pale)}.questionnaire{max-width:800px;margin:auto;padding:50px 24px}.questionnaire .brand{display:block;width:150px;margin:0 auto 35px}.questionnaire h1{font-size:35px;margin-bottom:24px}.questionnaire>p{font-size:14px;color:var(--muted);margin-bottom:30px}.questionnaire form{background:white;border:1px solid var(--line);padding:30px}.questionnaire label{display:block;font-size:13px;margin-bottom:24px}.questionnaire input,.questionnaire textarea{color:var(--ink);border-color:var(--line);padding:10px;font-size:14px;background:var(--pale);margin-top:8px}.questionnaire .consent{color:var(--ink)}.questionnaire .consent input{width:18px;margin:0}.questionnaire a{text-decoration:underline}.questionnaire #save-status{font-size:13px;margin-top:20px}#person-name{color:var(--blue)}</style><script src="questionnaire.js" defer></script></head><body><main class="questionnaire"><a class="brand" href="index.html"><img src="../assets/logo-full.png" alt="חגי ולנשטין ושות׳" width="1125" height="825"></a><p class="eyebrow">שאלון לפרופיל באתר המשרד</p><h1 id="person-name">פרטים מקצועיים</h1><p>השאלון עוזר להכין פרופיל מדויק לאתר. בסיום ניתן להוריד קובץ תשובות ולהעבירו לטל. התשובות אינן נשמרות בשרת ואינן נשלחות אוטומטית. הורידו את הקובץ לפני סגירת העמוד.</p><form id="profile-form"><label>שם מלא ותואר מקצועי<input name="name" required autocomplete="name" maxlength="120"></label><label>תפקיד במשרד<input name="role" required maxlength="200"></label><label>תחומי עיסוק והתמחות<textarea name="practice" rows="4" required maxlength="4000"></textarea></label><label>ניסיון מקצועי, תפקידים קודמים ותאריכים<textarea name="experience" rows="5" maxlength="5000"></textarea></label><label>השכלה, רישיונות והסמכות, כולל מוסד ושנה<textarea name="education" rows="4" maxlength="3000"></textarea></label><label>תפקידים ציבוריים או התנדבות<textarea name="community" rows="3" maxlength="2000"></textarea></label><label>אילו סוגי לקוחות או עבודות חשוב שיופיעו בפרופיל?<textarea name="clients" rows="3" maxlength="2000"></textarea></label><label>דגשים לניסוח ומידע שצריך להסיר מהפרופיל הקיים<textarea name="notes" rows="3" maxlength="2000"></textarea></label><label>קישור לתמונה מקצועית שבחרתם לפרסום, אם יש<input type="url" name="photo" placeholder="https://" maxlength="2000"></label><label class="consent"><input type="checkbox" name="reviewed" required><span>עברתי על הפרטים. הם מיועדים להכנת פרופיל מקצועי לפרסום באתר המשרד.</span></label><button class="button button-dark" type="submit" disabled>הורדת קובץ התשובות</button><p id="save-status" role="status"></p><noscript>יש להפעיל JavaScript כדי להוריד את התשובות.</noscript></form></main></body></html>
