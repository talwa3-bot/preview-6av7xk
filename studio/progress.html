<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>מצב העבודה | חגי ולנשטין ושות׳</title><link rel="stylesheet" href="studio.css?v=3"><style>body{background:var(--pale)}.work-status{max-width:700px;margin:32px auto;padding:30px 24px}.status-brand{display:block;width:170px;margin:0 auto 35px}.work-status h1{font-size:27px;text-align:center;font-weight:500}.status-card{background:white;border:1px solid var(--line);margin-top:28px;padding:30px;border-radius:3px}.eta-label{font-size:12px;color:var(--muted)}.eta{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-top:10px}.eta strong{font-size:48px;font-weight:300;letter-spacing:-.04em;direction:ltr;font-variant-numeric:tabular-nums}.eta>span{font-size:13px;color:var(--muted)}.status-track{height:5px;background:var(--ice);margin-top:24px;overflow:hidden}.status-track>span{display:block;height:100%;background:var(--blue);width:0;transition:width .5s ease}.status-note{font-size:14px;color:var(--muted);line-height:1.85;margin-top:23px}.status-steps{padding:0;list-style:none;margin:30px 0 0}.status-steps li{display:flex;align-items:center;gap:15px;padding:15px 0;border-top:1px solid var(--line);font-size:13px}.status-steps i{display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--line);border-radius:50%;font-style:normal;flex:none;font-size:12px}.status-steps li[data-state=complete] i{background:var(--blue);border-color:var(--blue);color:#fff}.status-steps li[data-state=current]{color:var(--blue)}.status-steps li[data-state=current] i{border-color:var(--blue);border-width:2px}.status-footnote{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.9}.work-status .button{width:100%;margin-top:25px;justify-content:center}.status-updated{font-size:10px;color:var(--muted);margin-top:16px;text-align:center}@media(max-width:500px){.work-status{margin-top:15px;padding:25px 20px}.status-card{padding:24px 20px}.work-status h1{font-size:23px}.status-brand{width:145px}.eta strong{font-size:43px}.status-steps li{font-size:12px}.status-note{font-size:13px}}</style><script src="progress.js" defer></script></head><body><main class="work-status"><img class="status-brand" src="../assets/logo-full.png" alt="חגי ולנשטין ושות׳ רואי חשבון" width="1125" height="825"><h1>מצב העבודה על האתר</h1><section class="status-card"><p class="eta-label" id="eta-label">זמן משוער שנותר</p><div class="eta"><strong id="countdown">—</strong><span id="percent">טוענת סטטוס</span></div><div class="status-track" role="progressbar" aria-label="התקדמות שלבי העבודה" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div><p class="status-note" id="status-note" role="status"></p><ol class="status-steps" id="status-steps"></ol><a class="button button-dark" id="finished-link" href="#" hidden>פתיחת האתר המוכן ←</a><p class="status-footnote">הזמן ומשקל שלבי העבודה הם הערכה. ההתקדמות מתעדכנת לפי שלבים שהושלמו בפועל; חלוף הזמן לבדו אינו מסמן שהעבודה הסתיימה.</p></section><p class="status-updated" id="status-updated"></p></main></body></html>
